name: registry
# Lists a released version in the MCP registry from that tag's server.json.
# release.yml calls this after npm publish. Run it from the Actions tab to list
# a version whose release went out but whose listing did not, without re-releasing.
on:
  workflow_call:
    inputs:
      version:
        description: "Released version, without the v"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to list, without the v (e.g. 0.5.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      # Bump deliberately, never to releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - name: Check server.json names this version
        run: |
          listed="$(jq -r '.version' server.json)"
          [ "$listed" = "$VERSION" ] || { echo "server.json at v$VERSION says $listed"; exit 1; }
      # The registry checks that this version of codemcp-cli exists on npm and carries the
      # `mcpName` in server.json. A just-published version can take minutes to be served.
      - name: Wait for codemcp-cli on npm
        run: |
          for attempt in $(seq 1 40); do
            if npm view "codemcp-cli@$VERSION" version >/dev/null 2>&1; then exit 0; fi
            echo "codemcp-cli@$VERSION not on npm yet (attempt $attempt); waiting 15 s"
            sleep 15
          done
          echo "codemcp-cli@$VERSION never appeared on npm"
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          # npm's API and the registry's view of it can lag each other; retry a few times.
          for attempt in 1 2 3 4; do
            ./mcp-publisher publish && exit 0
            echo "registry publish attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
