name: release
# Publishes every package under packages/ to npm at one shared version.
# Run it from the Actions tab (workflow_dispatch). It bumps the version, tags
# the commit, publishes with provenance, and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump, or an exact version like 0.2.0"
        required: true
        default: patch
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        default: latest
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Bump version
        id: bump
        run: |
          echo "version=$(node scripts/release.mjs bump '${{ inputs.bump }}')" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json server.json
          git commit -m "Release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        # Authenticates with npm trusted publishing (OIDC): each package on
        # npmjs.com trusts this repository's release.yml, and the id-token
        # permission above lets pnpm mint a short-lived token plus provenance.
        # Do not set NODE_AUTH_TOKEN here, even empty: it disables OIDC.
        run: pnpm -r --filter './packages/*' publish --access public --no-git-checks --tag '${{ inputs.tag }}'

      - name: Push commit and tag
        run: git push origin HEAD:main "v${{ steps.bump.outputs.version }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" --generate-notes --title "v${{ steps.bump.outputs.version }}" \
            $([ '${{ inputs.tag }}' != 'latest' ] && echo --prerelease)

      # The MCP registry listing goes last: it checks that codemcp-cli on npm carries the
      # `mcpName` in server.json, and a failure here leaves npm, the tag and the release intact.
      # Only stable releases are listed. Bump MCP_PUBLISHER_VERSION deliberately; never use releases/latest.
      - name: Install cosign
        if: inputs.tag == 'latest'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP registry
        if: inputs.tag == 'latest'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          # npm can take a moment to serve a just-published version to the registry's check.
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "registry publish attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
